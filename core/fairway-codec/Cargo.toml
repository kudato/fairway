[package]
name = "fairway-codec"
description = "In-memory text and data codecs for Fairway"
documentation = "https://docs.rs/fairway-codec"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
