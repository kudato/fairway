# The release process. A release is a version tag on a commit in main;
# everything after the tag push is machine-checked and machine-executed.
#
# To release:
#   1. Bump `version` in Cargo.toml and run `cargo check` so that
#      Cargo.lock records the new version.
#   2. Commit: `chore: bump version to X.Y.Z`.
#   3. Tag and push: `git tag vX.Y.Z && git push origin main --tags`.
#
# The changelog is the release notes GitHub generates from the commits
# since the previous tag; nothing is written by hand.
#
# Publishing uses crates.io Trusted Publishing (OIDC): this repository,
# this workflow file, and the `release` environment must be registered
# as a trusted publisher of the crate on crates.io; no token secret is
# stored. PyPI is published the same way — the binary is packaged into
# platform wheels by maturin, each wheel is smoke-tested on its own
# platform before anything is uploaded, and the same registration
# (repository, workflow file, `release` environment) must exist for
# the `fairway` project on PyPI. The upload skips files already on the
# index, so a partially published release is finished by re-running
# the failed jobs, not by burning a new version.
#
# Residual risk: until the repository settings gain a ruleset restricting
# `v*` tag creation and protection rules on the `release` environment,
# anyone with write access to the repository can publish by pushing a tag.

name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Tag matches the package version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}"
            exit 1
          fi

      - name: Tag is on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at a commit that is not on main"
            exit 1
          fi

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes

  wheel:
    name: wheel (${{ matrix.target }})
    needs: ci
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2_17"
            test: uv
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2_17"
            test: uv
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
            test: alpine
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_2
            test: alpine
          - os: macos-latest
            target: aarch64-apple-darwin
            test: uv
          # The arm64 macOS runner cannot execute an x86_64 build;
          # this is the one wheel that ships untested.
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            test: uv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.14.1
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist --compatibility pypi
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        if: matrix.test == 'uv'
      # The exact path an agent takes: an ephemeral install of the
      # freshly built wheel, then a real invocation.
      - name: Smoke-test the wheel
        if: matrix.test == 'uv'
        shell: bash
        run: uv tool run --from dist/*.whl fairway --version
      - name: Smoke-test the wheel on musl
        if: matrix.test == 'alpine'
        run: |
          docker run --rm -v "$PWD/dist":/dist python:3.13-alpine \
            sh -c 'pip install /dist/*.whl && fairway --version'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.target }}
          path: dist

  sdist:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.14.1
          command: sdist
          args: --out dist
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      # The fallback path for platforms without a wheel: a full build
      # from source with the runner's own Rust toolchain.
      - name: Smoke-test the sdist
        run: uv tool run --from dist/*.tar.gz fairway --version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist

  publish-pypi:
    # Gated on `release` so the tag and branch checks run first and the
    # registries cannot diverge: nothing lands on PyPI unless crates.io
    # accepted the same version.
    needs: [release, wheel, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      # --check-url makes the upload idempotent: files already on the
      # index are recognized and skipped instead of failing as
      # duplicates.
      - name: Publish to PyPI
        run: uv publish -v --check-url https://pypi.org/simple/ dist/*
