# The workspace: the binary and the core libraries it is built on.
# Every crate carries the same version; a release publishes the
# libraries before the binary that depends on them.

[workspace]
resolver = "3"
members = [
    "core/fairway",
    "core/fairway-cli",
]

[workspace.package]
version = "0.0.2"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kudato/fairway"
keywords = ["ai", "agents", "agent-skills", "git", "cli"]
categories = ["artificial-intelligence", "command-line-utilities", "development-tools"]

[workspace.dependencies]
# Pinned exactly: the crates of one release share one version. Bump
# together with `workspace.package.version`; cargo refuses to build
# while the two disagree.
fairway-cli = { version = "=0.0.2", path = "core/fairway-cli" }

# Command declarations and registration.
clap = { version = "4", features = ["derive"] }
linkme = "0.3.37"

# Execution and errors.
tokio = "1.26"
tokio-util = "0.7"
anyhow = "1"

# Tests and documentation examples.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
pulldown-cmark = { version = "0.13", default-features = false }
tempfile = "3"
trycmd = "1.2"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
mod_module_files = "warn"
