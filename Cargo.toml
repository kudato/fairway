[package]
name = "fairway"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
description = "The path for AI agents (and maybe some humans) to get things done"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kudato/fairway"
documentation = "https://docs.rs/fairway"
readme = "README.md"
keywords = ["ai", "agents", "agent-skills", "git", "cli"]
categories = ["artificial-intelligence", "command-line-utilities", "development-tools"]
exclude = ["/.github"]

[lints.rust]
missing_docs = "warn"
unsafe_code = "warn"
unreachable_pub = "warn"

[lints.clippy]
mod_module_files = "warn"

[dependencies]
anyhow = "1"
tokio = { version = "1.26", features = ["rt", "macros", "process", "fs", "signal"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["time"] }
