# The workspace: the core library, the binary, and, as they appear,
# the plugins. Every crate carries the same version; a release
# publishes them all, the core first.

[workspace]
resolver = "3"
members = ["crates/fairway-core", "crates/fairway"]

[workspace.package]
version = "0.0.2"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kudato/fairway"
keywords = ["ai", "agents", "agent-skills", "git", "cli"]
categories = ["artificial-intelligence", "command-line-utilities", "development-tools"]

[workspace.dependencies]
# Pinned exactly: the crates of one release share one version. Bump
# together with `workspace.package.version`; cargo refuses to build
# while the two disagree.
fairway-core = { version = "=0.0.2", path = "crates/fairway-core" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
tempfile = "3"
tokio = "1.26"
toml = "0.9"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
mod_module_files = "warn"
